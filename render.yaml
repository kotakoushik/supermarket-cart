services:
  - type: web
    name: freshcart-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FRESHCART_ADMIN_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://smartsmart-frontend.onrender.com,http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000"

  - type: static
    name: smartsmart-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://freshcart-backend.onrender.com/api
