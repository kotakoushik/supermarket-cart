services:
  - type: web
    name: freshcart-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FRESHCART_ADMIN_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000"
