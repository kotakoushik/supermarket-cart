services:
  # MySQL 8.4 Production-grade Database
  mysql:
    image: mysql:8.4
    container_name: freshcart-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-supermarket_db}
      MYSQL_USER: ${DB_USER:-freshcart_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-freshcart_secret_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - freshcart-net

  # Spring Boot Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freshcart-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-supermarket_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USER:-freshcart_user}
      DB_PASSWORD: ${DB_PASSWORD:-freshcart_secret_pass}
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000
      FRESHCART_ADMIN_KEY: ${FRESHCART_ADMIN_KEY:-fc-admin-key-2025}
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - freshcart-net

  # React + Vite Production Frontend with Nginx & API Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: freshcart-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - freshcart-net

volumes:
  mysql_data:
    driver: local

networks:
  freshcart-net:
    driver: bridge
