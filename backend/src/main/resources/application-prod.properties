spring.application.name=supermarket-cart-backend
server.port=${PORT:8080}

# MySQL Database configuration for production
# Exactly reads DB_URL, DB_USERNAME, and DB_PASSWORD from environment variables.
# For Aiven MySQL or managed cloud databases, DB_URL must use TLS with sslMode=REQUIRED:
# e.g. jdbc:mysql://<aiven-host>:<port>/<dbname>?sslMode=REQUIRED
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console disabled in prod
spring.h2.console.enabled=false

# CORS configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://smartsmart-frontend.onrender.com,http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}

# Admin Security Key strictly required from environment
freshcart.admin.key=${FRESHCART_ADMIN_KEY}

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA Settings
spring.jpa.open-in-view=false
